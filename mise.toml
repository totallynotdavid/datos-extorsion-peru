[tools]
python = "3.15"
uv = "0.13.6"
oxfmt = "0.75.0"
node = "26"
"github:protomaps/go-pmtiles" = "1.31.2"

[tasks.install]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked --group dev"

[tasks."lint:py"]
description = "Check Python lint and formatting with ruff"
run = ["uv run ruff check --no-fix .", "uv run ruff format --check ."]

[tasks."lint:md"]
description = "Check Markdown formatting with oxfmt"
run = "oxfmt --check --no-error-on-unmatched-pattern '**/*.md' '!README.md'"

[tasks.lint]
description = "Run every static check without writing"
depends = ["lint:*"]

[tasks.format]
description = "Format and apply safe fixes to every file type"
run = [
  "uv run ruff format .",
  "uv run ruff check --fix .",
  "oxfmt --write --no-error-on-unmatched-pattern '**/*.md' '!README.md'",
]

[tasks.typecheck]
description = "Type-check src and tests with mypy strict"
run = "uv run mypy src tests"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.check]
description = "Run lint, typecheck and test without writing"
depends = ["lint", "typecheck", "test"]

[tasks.web-install]
description = "Install the web app dependencies"
run = "npm --prefix web ci --no-audit --no-fund"

[tasks.web-dev]
description = "Start the Vite dev server"
depends = ["web-install"]
run = "npm --prefix web run dev"

[tasks.web-build]
description = "Build the static site into web/dist"
depends = ["web-install"]
run = "npm --prefix web run build"

[tasks.web-test]
description = "Build the site and run the Playwright tests against it"
depends = ["web-install"]
run = "npm --prefix web test"

[tasks.web-tiles]
description = "Download the Protomaps Peru extract into web/public/peru.pmtiles"
run = [
  "mkdir -p web/public",
  "pmtiles extract https://build.protomaps.com/20261020.pmtiles web/public/peru.pmtiles --bbox=-81.4,-18.4,-68.6,0.1 --maxzoom=13",
]

[tasks.worker-install]
description = "Install the worker dependencies"
run = "npm --prefix worker ci --no-audit --no-fund"

[tasks.worker-test]
description = "Type-check the worker and run it locally in workerd against a simulated R2 bucket"
depends = ["worker-install"]
run = ["npm --prefix worker run typecheck", "npm --prefix worker test"]

[tasks.deploy]
description = "Build the site and deploy the worker; needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
depends = ["web-build", "worker-install"]
run = "worker/node_modules/.bin/wrangler deploy"

[tasks.data-publish]
description = "Upload the exported map data in web/public/data to the R2 bucket; needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
depends = ["worker-install"]
run = [
  "worker/node_modules/.bin/wrangler r2 object put extorsion-tiles/data/districts.geojson --remote --file web/public/data/districts.geojson --content-type application/geo+json",
  "worker/node_modules/.bin/wrangler r2 object put extorsion-tiles/data/extorsion.json --remote --file web/public/data/extorsion.json --content-type application/json",
  "worker/node_modules/.bin/wrangler r2 object put extorsion-tiles/data/turnos.json --remote --file web/public/data/turnos.json --content-type application/json",
  "worker/node_modules/.bin/wrangler r2 object put extorsion-tiles/data/victimas.json --remote --file web/public/data/victimas.json --content-type application/json",
]

[tasks.tiles-publish]
description = "Upload web/public/peru.pmtiles to the R2 bucket; needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
depends = ["worker-install"]
run = "worker/node_modules/.bin/wrangler r2 object put extorsion-tiles/peru.pmtiles --remote --file web/public/peru.pmtiles --content-type application/octet-stream"

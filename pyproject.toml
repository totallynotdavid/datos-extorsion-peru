[project]
name = "dep"
version = "0.1.0"
description = "Open data pipeline for crime and extortion events in Peru"
requires-python = ">=3.15,<3.16"
readme = "README.md"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.0",
    "python-calamine>=0.9.0",
]

[project.scripts]
dep = "dep.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dep"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = ["__pycache__", "dist", "build", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
